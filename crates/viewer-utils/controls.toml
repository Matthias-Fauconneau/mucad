# The default controls of the camera in the µcad viewers with the mouse, the keys and touch.
#
# Missing entries are these defaults, e.g. a file with only `[mouse]` and `pan = ["Middle"]`
# changes only panning with the mouse.
#
# A binding is its modifiers and its input joined by `+`, e.g. `Ctrl+Shift+Right`.
# Modifiers: `Ctrl`, `Shift`, `Alt` (`Option`), `Meta` (`Cmd`, `Super`), which must be pressed
# exactly.

# The factor, which a zoom key scales the view by.
zoom_step = 1.25
# The part of the window, which a pan key moves the view by.
pan_step = 0.1
# The angle in degrees, which a rotate key turns the view by.
rotate_step = 90.0

# The projection and the speeds of the camera with the mouse.
[camera]
# The projection at the start: `orthographic` or `perspective`.
projection = "orthographic"
# The vertical field of view of the perspective projection in degrees.
fov_y_degrees = 30.0
# The speed of orbiting.
orbit_speed = 25.0
# The speed of zooming by dragging, a negative speed inverts zooming.
zoom_speed = 25.0
# The speed of zooming with the wheel, a negative speed inverts zooming.
wheel_speed = 8.0
# The speed of translating, which is not used yet: translating follows the mouse.
translate_speed = 15.0

# The navigation style with the mouse.
#
# Buttons: `Left`, `Middle` (pressing the wheel) and `Right`, which are pressed in their
# order, e.g. `Middle+Right` is first the middle and then the right button. `Wheel` is turning
# the wheel, which only zooms.
[mouse]
# Click to select, also more than one object with the `multi_select` modifiers. A binding,
# which also drags, e.g. `Left` of `pan`, drags when the mouse moves more than a few pixels.
select = ["Left"]
# Turn the wheel to zoom at the pointer, or drag upwards to zoom in and downwards to zoom out.
zoom = ["Wheel", "Ctrl+Shift+Right"]
# Drag to orbit around the point under the pointer.
orbit = ["Middle+Right", "Middle+Left", "Right"]
# Drag to pan, the model stays under the pointer.
pan = ["Left", "Middle", "Ctrl+Right"]

# The keys, which are available with any navigation style.
#
# Keys are logical keys, like `KeyboardEvent.key` of the web: named keys like `ArrowLeft`,
# `PageUp`, or characters like `0` or `a`, with `Plus`, `Minus` and `Space` for `+`, `-` and
# ` `. Shift is ignored for characters, because keyboard layouts need it for some of them.
[keyboard]
zoom_in = ["Ctrl+Plus", "PageUp"]
zoom_out = ["Ctrl+Minus", "PageDown"]
# Show the whole scene in the middle of the view.
zoom_fit = ["f"]
# Change between the orthographic and the perspective projection.
toggle_projection = ["p"]
pan_left = ["ArrowLeft"]
pan_right = ["ArrowRight"]
pan_up = ["ArrowUp"]
pan_down = ["ArrowDown"]
rotate_left = ["Shift+ArrowLeft"]
rotate_right = ["Shift+ArrowRight"]
view_isometric = ["0"]
view_front = ["1"]
view_top = ["2"]
view_right = ["3"]
view_rear = ["4"]
view_bottom = ["5"]
view_left = ["6"]
# Pressed while selecting, to select more than one object.
multi_select = "Ctrl"

# The gestures of touch screens: two fingers pinch to zoom and pan, a tap selects.
[touch]
# Drag with one finger to `orbit` around the point under the finger, or to `pan`.
one_finger = "orbit"
