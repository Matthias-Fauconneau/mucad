[package]
name = "mucad-viewer-utils"
description = "µcad viewer utilities: camera controller and zoom model shared by the viewers"
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true
keywords.workspace = true

[features]
# The parameters of the shaders as uniforms of Bevy, e.g. `GridConfig`. The version of `encase`
# must be the one of Bevy.
encase = ["dep:encase", "glam/encase"]

[dependencies]
encase = { version = "0.12", optional = true }
glam = "0.30"
serde = { version = "1.0", features = ["derive"] }
strum = { version = "0.28", features = ["derive"] }
toml = { version = "1.1.2", features = ["serde"] }

mucad-core = { workspace = true }

[dev-dependencies]
# The vectors of the meshes of mucad-core in tests.
cgmath = "0.18"
# Checks the layout of the uniforms against their WGSL.
naga = { version = "27", features = ["wgsl-in"] }

[lints.rust]
missing_docs = "warn"

[lints.clippy]
unwrap_used = "warn"
