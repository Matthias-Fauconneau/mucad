[package]
name = "mucad-lang-format"
description = "µcad language formatter"
documentation = "https://docs.rs/mucad-lang-format"
authors = ["Michael Winkelmann (michael@winkelmann.site)"]
version.workspace = true
edition.workspace = true
homepage.workspace = true
repository.workspace = true
rust-version.workspace = true
license.workspace = true
keywords.workspace = true

[dependencies]
# The markdown blocks of comments, whose text is wrapped.
pulldown-cmark = { version = "0.13", default-features = false }
thiserror = "2.0"

mucad-lang-base = { workspace = true }
mucad-lang-parse = { workspace = true }

[dev-dependencies]
insta = "1.45.0"
pretty_assertions = "1.4"
